<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de diploma · AMH</title><meta name="theme-color" content="#0a2540"><style>body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,sans-serif;color:#0f172a}.box{max-width:760px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 12px 40px #0a254018}h1{color:#0a2540}.valid{background:#ecfdf5;border-left:5px solid #10b981;padding:16px;border-radius:10px}.invalid{background:#fff1f2;border-left:5px solid #f43f5e;padding:16px;border-radius:10px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}.btn{margin-top:10px;border:0;border-radius:999px;padding:10px 18px;background:#0a2540;color:#fff;font-weight:700}</style></head><body><main class="box"><img src="../images/img_02.jpg" alt="AMH Sección Tabasco" style="max-width:360px;width:100%"><h1>Verificación de diploma</h1><p>Ingresa el folio impreso en el diploma.</p><input id="folio" placeholder="AMH-HID-2026-000001"><button class="btn" id="go">Verificar</button><div id="out" style="margin-top:20px"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js?v=4"></script><script>const c=()=>supabase.createClient(AMH_CONFIG.SUPABASE_URL,AMH_CONFIG.SUPABASE_ANON_KEY);async function verify(){const f=folio.value.trim();if(!f)return;out.innerHTML='Verificando…';const {data,error}=await c().rpc('verify_certificate',{input_folio:f});const r=data?.[0];out.innerHTML=error||!r?'<div class="invalid"><b>Diploma no encontrado</b><br>El folio no corresponde a un diploma emitido por el sistema.</div>':`<div class="valid"><h2>DIPLOMA VÁLIDO</h2><p><b>Participante:</b> ${r.full_name}</p><p><b>Curso:</b> ${r.course_name}</p><p><b>Calificación:</b> ${r.score}%</p><p><b>Fecha:</b> ${new Date(r.issued_at).toLocaleDateString('es-MX')}</p><p><b>Folio:</b> ${r.folio}</p></div>`}go.onclick=verify;const q=new URLSearchParams(location.search).get('folio');if(q){folio.value=q;verify()}</script></body></html>
