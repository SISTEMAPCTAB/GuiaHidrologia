<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Hidrología AMH</title><link rel="icon" href="../icons/icon-192.png"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:1400px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #0a254012}h1,h2{color:#0a2540}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;text-align:center}.kpi b{display:block;font-size:30px;color:#0a2540}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:#0a2540;color:#fff}.btn.alt{background:#e0f2fe;color:#0a2540}.password-wrap{position:relative}.password-wrap input{padding-right:105px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:1px solid #cbd5e1;background:#f8fafc;color:#0a2540;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px;box-sizing:border-box}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}.hidden{display:none}.status{padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#065f46;font-weight:700}.warn{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px}@media(max-width:700px){.filters{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>Panel de administración</h1><p>Acceso restringido. Solo personal autorizado.</p><label>Correo administrativo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password"><button class="password-toggle" type="button" id="toggleAdminPassword" aria-pressed="false">👁 Mostrar</button></div><button class="btn" id="loginBtn">Ingresar</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Seguimiento de capacitación</h1><p>Guía Interactiva de Hidrología e Inundaciones de Tabasco</p></div><button class="btn alt" id="logoutBtn">Salir</button></div><div class="grid" id="kpis"></div><div class="card"><div class="filters"><div><label>Buscar</label><input id="q" placeholder="Nombre, correo, institución o municipio"></div><div><label>Institución</label><select id="inst"><option value="">Todas</option></select></div><div><label>Municipio</label><select id="mun"><option value="">Todos</option></select></div><button class="btn" id="csv">Exportar CSV</button></div><div id="extra"></div><div class="table"><table><thead><tr><th>Participante</th><th>Institución</th><th>Municipio</th><th>Avance</th><th>Intentos</th><th>Calificación</th><th>Estatus</th><th>Folio</th><th>Última actividad</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="detail" class="card hidden"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js?v=414"></script><script src="admin.js?v=414"></script></body></html>
