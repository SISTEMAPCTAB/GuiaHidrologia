{short:"12. Lectura de datos",t:"Lectura hidrológica de datos: lluvia, niveles y gastos",html:`
<h2>12. Lectura hidrológica de datos: lluvia, niveles y gastos</h2>
<figure class="amh-visual"><img loading="lazy" src="images/img_22.webp" alt="Red de monitoreo hidrometeorológico" decoding="async"></figure>
<p>La información hidrometeorológica permite comprender el comportamiento del agua cuando se interpreta de manera integrada. Un dato aislado puede llevar a conclusiones equivocadas.</p>
<h3>Cómo leer datos si no eres hidrólogo</h3>
<p>Un dato aislado puede engañar. Lo importante es observar la tendencia y hacer preguntas: ¿sube rápido o lento?, ¿sigue subiendo?, ¿ya alcanzó pico?, ¿se mantiene en meseta?, ¿hay otro pulso de lluvia aguas arriba?, ¿el río puede descargar o hay remanso?</p>
<table><tr><th>Dato</th><th>Qué significa</th><th>Error común</th></tr>
<tr><td>Lluvia acumulada</td><td>Total de agua caída en un periodo.</td><td>Creer que el mismo acumulado tiene igual efecto en todas las regiones.</td></tr>
<tr><td>Intensidad</td><td>Velocidad con que cae la lluvia.</td><td>No diferenciar lluvia de una hora y lluvia de 24 horas.</td></tr>
<tr><td>Nivel</td><td>Altura del agua en una estación.</td><td>Comparar niveles de estaciones distintas como si fueran iguales.</td></tr>
<tr><td>Gasto</td><td>Volumen que pasa por segundo.</td><td>Ignorar que el gasto explica magnitud del flujo.</td></tr>
<tr><td>Tendencia</td><td>Dirección del cambio: sube, baja o se mantiene.</td><td>Ver solo el dato del momento y no la evolución.</td></tr></table>
<div class="note"><b>Regla práctica:</b> un río que sube rápido exige atención al tiempo de respuesta; un río que se mantiene alto exige atención al volumen, salida y remanso.</div>

<div class="grid2">
 <div class="card"><h3>Lluvia</h3><p>Debe leerse por acumulado, intensidad, duración y distribución espacial. 80 mm en una hora no significan lo mismo que 80 mm en 24 horas.</p></div>
 <div class="card"><h3>Nivel y gasto</h3><p>El nivel muestra altura local; el gasto expresa volumen por segundo. Ambos deben relacionarse con tendencia y ubicación.</p></div>
</div>
${hydrographHTML()}
${flipCards(concepts.slice(2,10))}
<div class="key">Mensaje clave: tendencia, contexto de cuenca y comparación entre estaciones son más importantes que un dato aislado.</div>`},

{short:"13. Escenarios",t:"Escenarios hidrológicos regionales",html:`
<h2>13. Escenarios hidrológicos regionales</h2>
<p>Los escenarios ayudan a integrar variables: fenómeno meteorológico, región, condición antecedente, niveles de ríos, costa, drenaje y tiempo de respuesta.</p>
<h3>Cómo construir un escenario hidrológico</h3>
<p>Un escenario no es una predicción exacta; es una lectura ordenada de condiciones que pueden coincidir. Para construirlo se combinan cinco capas: fenómeno meteorológico, lluvia esperada, humedad antecedente, estado de ríos y capacidad de salida, drenaje y zonas de regulación natural.</p>
<table><tr><th>Capa</th><th>Pregunta guía</th><th>Ejemplo</th></tr>
<tr><td>Fenómeno</td><td>¿Qué está generando la lluvia?</td><td>Frente frío, onda tropical, ciclón, Norte.</td></tr>
<tr><td>Lluvia</td><td>¿Cuánto y en cuánto tiempo?</td><td>100 mm en 6 horas no equivale a 100 mm en 24 horas.</td></tr>
<tr><td>Cuenca</td><td>¿Es serrana, planicie, costera o transfronteriza?</td><td>Sierra responde rápido; Usumacinta propaga volumen.</td></tr>
<tr><td>Antecedente</td><td>¿El suelo está seco o saturado?</td><td>Suelo saturado produce más escurrimiento.</td></tr>
<tr><td>Salida y regulación</td><td>¿El agua puede desalojar o almacenarse sin causar daño?</td><td>Dren alto, marea alta, bocana azolvada o zonas de regulación llenas prolongan anegamiento.</td></tr></table>

${scenarioHTML("sc13")}
<div class="grid2">
 <div class="card"><h3>Lluvia intensa en Sierra</h3><p>Alta intensidad, pendiente fuerte y suelo saturado. Resultado: respuesta rápida y posible creciente súbita.</p></div>
 <div class="card"><h3>Usumacinta desde cuenca alta</h3><p>Lluvias en Guatemala y Chiapas. Resultado: propagación progresiva hacia Los Ríos y Centla.</p></div>
 <div class="card"><h3>Alto Grijalva regulado en Chiapas</h3><p>Corresponde al sistema de presas La Angostura, Chicoasén, Malpaso y Peñitas. Sus descargas se distribuyen hacia Tabasco por Mezcalapa, Samaria y Carrizal; no debe confundirse con el Grijalva tabasqueño de ríos serranos.</p></div>
 <div class="card"><h3>Costa con Norte</h3><p>Viento, marea, bocanas y lagunas saturadas. Resultado: salida lenta y permanencia prolongada.</p></div>
</div>
<div class="key">Mensaje clave: un escenario hidrológico se construye combinando variables, no con una sola causa.</div>`},

{short:"14. Gestión de cuencas",t:"Gestión Integral de Cuencas",html:`
<h2>14. Gestión Integral de Cuencas</h2>
<p>La gestión integral de cuencas reconoce que el agua debe analizarse desde su origen hasta su desembocadura. Lo que ocurre en la parte alta modifica la parte media y baja; lo que se altera en humedales, cauces, laderas o planicies cambia el comportamiento de las inundaciones.</p>
<h3>Gestión de cuencas explicada en lenguaje claro</h3>
<p>Gestionar una cuenca significa tomar decisiones considerando todo el camino del agua. No basta limpiar un dren si aguas arriba se deforesta, si se ocupan cauces, si se rellenan humedales o si la descarga al mar está obstruida. La cuenca funciona como un sistema conectado.</p>
<figure class="amh-visual"><img loading="lazy" alt="Gestión integral de cuencas" src="images/img_23.webp" decoding="async"></figure>

<div class="grid2">
 <div class="card"><h3>Parte alta</h3><p>Conservación de suelos, cobertura vegetal, control de erosión, monitoreo de lluvia y reducción de escurrimiento violento.</p></div>
 <div class="card"><h3>Parte media y baja</h3><p>Mantenimiento de cauces y drenes, protección de humedales, ordenamiento territorial y respeto a planicies de inundación.</p></div>
</div>
<h3>Acciones que reducen o aumentan el problema</h3>
<table><tr><th>Ayuda a la cuenca</th><th>Perjudica la cuenca</th></tr>
<tr><td>Conservar vegetación ribereña.</td><td>Eliminar cobertura vegetal en laderas.</td></tr>
<tr><td>Proteger humedales y zonas de regulación.</td><td>Rellenar bajos naturales y lagunas.</td></tr>
<tr><td>Monitorear lluvia y niveles aguas arriba.</td><td>Construir sin considerar escurrimientos naturales.</td></tr>
<tr><td>Dar mantenimiento técnico a drenes y bocanas.</td><td>Obstruir cauces con obras mal diseñadas.</td></tr></table>
<figure class="amh-visual"><img loading="lazy" alt="Cuenca degradada" src="images/img_24.webp" decoding="async"></figure>


${accordion([
["Unidad territorial","La cuenca es la unidad natural de análisis. Permite conectar lluvia, escurrimiento, sedimentos, drenaje, humedales y costa."],
["Conservación de suelos y vegetación","La cobertura vegetal reduce erosión, modera escurrimientos y favorece infiltración."],
["Humedales y zonas de regulación","Los humedales almacenan agua, laminan crecientes y reducen velocidad de flujo."],
["Ordenamiento territorial","Evita ocupar cauces, zonas bajas y planicies de inundación sin criterios hidráulicos."],
["Monitoreo hidrometeorológico","Estaciones de lluvia y nivel en cuencas altas permiten anticipar crecientes aguas abajo."],
["Manejo de sedimentos","El azolvamiento reduce capacidad de cauces, drenes y bocanas; debe tratarse con criterio técnico."]
])}
<div class="interactive-box">
 <h3>Decisiones en la cuenca</h3>
 <p>Clasifica mentalmente cada acción. Después presiona “ver lectura”.</p>
 <table><tr><th>Acción</th><th>Lectura hidrológica</th></tr>
 <tr><td>Conservar humedales</td><td>Ayuda a regular y almacenar agua.</td></tr>
 <tr><td>Rellenar zonas bajas</td><td>Reduce almacenamiento natural y puede trasladar el problema.</td></tr>
 <tr><td>Monitorear cuencas altas</td><td>Mejora anticipación de crecientes.</td></tr>
 <tr><td>Construir en cauces naturales</td><td>Aumenta exposición y puede obstruir flujos.</td></tr>
 <tr><td>Mantener drenes con criterio técnico</td><td>Mejora conducción sin perder visión integral.</td></tr></table>
 </div>
<div class="key">Mensaje clave: la inundación se observa en la planicie, pero muchas de sus causas se construyen o atenúan a escala de cuenca.</div>`},

{short:"15. Gestión de inundaciones",t:"Gestión Integral de Inundaciones",html:`
<h2>15. Gestión Integral de Inundaciones</h2>
<figure class="amh-visual"><img loading="lazy" src="images/img_25.webp" alt="Obras hidráulicas en Tabasco" decoding="async"></figure>
<p>La gestión integral de inundaciones reconoce que inundarse es un proceso natural en planicies aluviales, humedales y zonas bajas. El reto es reducir impactos mediante conocimiento, planeación, infraestructura adecuada, conservación y adaptación territorial.</p>
<h3>Gestión de inundaciones para entender, no solo reaccionar</h3>
<figure class="amh-visual"><img loading="lazy" alt="Resiliencia hídrica en Tabasco" src="images/img_26.webp" decoding="async"></figure>

<p>Una inundación no siempre es una falla del sistema: en muchas planicies es un proceso natural. El problema aparece cuando ocupamos zonas inundables sin reconocer su función, cuando los drenes no pueden descargar, cuando se reducen humedales o cuando se espera que una sola obra resuelva toda la dinámica de una cuenca.</p>
<div class="grid2">
 <div class="card"><h3>Controlar</h3><p>Usar obras para conducir, contener o regular agua. Es útil, pero tiene límites y requiere mantenimiento.</p></div>
 <div class="card"><h3>Adaptar</h3><p>Reconocer zonas donde el agua puede entrar, permanecer o expandirse, y planear usos compatibles con esa realidad.</p></div>
 <div class="card"><h3>Restaurar</h3><p>Recuperar humedales, vegetación ribereña, cauces y zonas de almacenamiento natural.</p></div>
 <div class="card"><h3>Informar</h3><p>Traducir datos de lluvia, nivel y gasto en mensajes comprensibles para la toma de decisiones.</p></div>
</div>
<h3>Tipos de inundación que debe distinguir la guía</h3>
<table><tr><th>Tipo</th><th>Explicación sencilla</th><th>Ejemplo regional</th></tr>
<tr><td>Fluvial</td><td>El río crece y rebasa su cauce o se expande a su planicie.</td><td>Usumacinta, Samaria, Carrizal, ríos serranos.</td></tr>
<tr><td>Pluvial</td><td>La lluvia cae sobre una zona y el drenaje no alcanza.</td><td>Ciudades, cabeceras municipales y zonas agrícolas.</td></tr>
<tr><td>Por remanso</td><td>El agua no puede avanzar porque aguas abajo el nivel está alto.</td><td>Confluencias, costa, lagunas y drenes que no descargan.</td></tr>
<tr><td>Costera</td><td>Marea, oleaje o viento elevan niveles en el litoral.</td><td>Paraíso, Centla y barras costeras.</td></tr>
<tr><td>Mixta</td><td>Se combinan lluvia, río alto, drenaje limitado y costa.</td><td>Eventos regionales complejos.</td></tr></table>

<div class="grid2">
 <div class="card"><h3>Infraestructura hidráulica</h3><p>Bordos, canales, drenes, compuertas, obras de control y pasos hidráulicos. Son útiles, pero tienen límites y requieren mantenimiento y evaluación de efectos aguas arriba y aguas abajo.</p></div>
 <div class="card"><h3>Infraestructura natural</h3><p>Humedales, planicies de inundación, vegetación ribereña, zonas de retención y cuerpos lagunares. Ayudan a almacenar, laminar y regular el agua.</p></div>
</div>
${casesHTML()}
<div class="key">Mensaje clave: la mejor estrategia no es una sola obra ni una sola acción; es una combinación de conocimiento, infraestructura, naturaleza, planeación y cultura hídrica.</div>`},

{short:"Cierre",t:"Cierre integrador",html:`
<h2>Cierre integrador: comprender la cuenca para gestionar mejor el agua</h2>
<p>Tabasco es un territorio definido por el agua. Sus ríos, lagunas, humedales, planicies y costas forman un sistema hidrológico amplio, dinámico y conectado con las cuencas altas de Chiapas, Guatemala y Veracruz, así como con el Golfo de México.</p>
<p>Las inundaciones tienen causas diferenciadas: lluvias intensas locales, crecientes que viajan desde cuencas lejanas, descargas reguladas, bifurcaciones, remansos, drenajes de planicie, saturación de suelos, humedales, lagunas, mareas, viento del Norte, bocanas y baja pendiente.</p>
<p>La gestión integral de cuencas y de inundaciones representa una visión indispensable para el futuro hídrico de Tabasco. Esta visión reconoce que el agua debe entenderse desde su origen hasta su desembocadura, desde la montaña hasta la planicie, desde el cauce principal hasta los humedales, desde la lluvia intensa hasta el comportamiento prolongado de una inundación.</p>
<h3>Resumen para recordar</h3>
<ol>
<li>La lluvia debe interpretarse por intensidad, duración, ubicación y antecedente.</li>
<li>Las cuencas serranas responden rápido; las planicies almacenan; la costa puede frenar la salida.</li>
<li>El Usumacinta trae señales desde Guatemala y Chiapas; el Grijalva combina regulación y planicie.</li>
<li>Chontalpa depende mucho de drenes, canales, suelos y pendientes mínimas.</li>
<li>La gestión integral exige ver la cuenca completa, no solo el sitio inundado.</li>
</ol>

<div class="key">Comprender cómo se comporta el agua es el primer paso para planear mejor el territorio, reducir impactos, conservar cuencas y fortalecer la relación de la sociedad con sus ríos, humedales y costas.</div>
<div class="actions"><button class="btn-green" onclick="showCertificate()">Ver constancia</button><button class="btn-blue" onclick="renderModule(modules.length-2)">Ir a evaluación</button></div>`}

function selectRouteStep(id,i){
 const steps=getRouteSteps(id);
 if(!steps.length || !steps[i]) return;
 window[id+"_idx"]=i;
 const title=document.getElementById(id+"_title");
 const txt=document.getElementById(id+"_txt");
 const bar=document.getElementById(id+"_bar");
 if(title) title.textContent=steps[i][0];
 if(txt) txt.textContent=steps[i][1];
 if(bar) bar.style.width=((i+1)/steps.length*100)+"%";
 steps.forEach((_,j)=>{let b=document.getElementById(id+"_b"+j); if(b)b.classList.toggle("active",j===i);});
}
function nextRoute(id){
 const steps=getRouteSteps(id);
 let i=Math.min(steps.length-1,(window[id+"_idx"]||0)+1);
 selectRouteStep(id,i);
}
function prevRoute(id){
 let i=Math.max(0,(window[id+"_idx"]||0)-1);
 selectRouteStep(id,i);
}

 if(river==="Alto") condicion+=`<p><b>Río alto:</b> ${R.siRio}</p>`;
 else if(river==="Medio") condicion+=`<p><b>Río en nivel medio:</b> Margen limitado. Un ascenso adicional de 0.5–1 m puede cambiar el escenario radicalmente. Vigilancia prioritaria de tendencia.</p>`;
 else condicion+=`<p><b>Río bajo:</b> Hay margen inicial, pero la cuenca alta puede estar aportando sin que eso se refleje aún aguas abajo. No descartar ascenso diferido.</p>`;

 if(coast==="Norte fuerte") condicion+=`<p><b>Norte fuerte:</b> ${reg==="Costa–Pantanos"?"El Norte bloquea la salida al Golfo: bocanas cerradas, lagunas sin drenaje, remanso generalizado. Factor determinante en esta región.":"Puede dificultar descarga costera y lagunar. Si el sistema se mantiene, los efectos se acumulan aguas arriba de bocanas y puntos de salida."}</p>`;
 else if(coast==="Marea alta") condicion+=`<p><b>Marea alta:</b> ${reg==="Costa–Pantanos"?"La marea alta reduce el diferencial de nivel hacia el Golfo. El agua no puede salir con rapidez, prolongando la permanencia en zonas bajas y lagunas.":"La marea puede generar remanso en desembocaduras y dificultar el drenaje de zonas costeras y deltaicas."}</p>`;

 const regText={
  "Sierra":"En cuencas serranas la regulación natural es limitada; por eso la respuesta suele ser rápida y depende más de pendientes, cauces y saturación.",
  "Usumacinta":"Las planicies, bajos, lagunas y humedales funcionan como grandes zonas de regulación: almacenan volumen, reducen el pico y prolongan la permanencia del agua.",
  "Samaria–Carrizal":"La regulación combina presas, bifurcación, estructuras de control y planicie; si los bajos ya están ocupados, aumenta el remanso y la permanencia.",
  "Chontalpa":"En Chontalpa los bajos, drenes, lagunas interiores y parcelas anegables amortiguan parte del volumen; si están llenos o reducidos por bordos/caminos, el anegamiento se extiende.",
  "Costa–Pantanos":"Humedales, lagunas y barras costeras regulan el agua, pero si están saturados y la salida al Golfo está bloqueada, la inundación se vuelve prolongada.",
  "Área urbana":"Los vasos reguladores, parques inundables, cárcamos y drenes son la regulación urbana; si están llenos o sin mantenimiento, la lluvia se traduce en anegamiento rápido."
 };
 let regEstado = regulacion==="Disponibles" ? "todavía existe capacidad de amortiguamiento, aunque debe vigilarse su ritmo de ocupación." :
                 regulacion==="En llenado" ? "la capacidad de amortiguamiento se está consumiendo; el escenario puede escalar si continúa la lluvia o suben los ríos." :
                 "la capacidad de amortiguamiento está comprometida; el agua buscará caminos, parcelas, calles o zonas habitadas.";
 condicion+=`<p><b>Zonas de regulación ${regulacion.toLowerCase()}:</b> ${regText[reg]} En este escenario, ${regEstado}</p>`;

 // Puntuación visual normalizada sobre 10
 const maxP={"ESCENARIO EXTREMO":10,"ESCENARIO COMPLEJO":7,"ESCENARIO DE VIGILANCIA":4,"ESCENARIO ORDINARIO":2};

   <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:24px">${sevIcon[label]}</span>

function previewSeverity(id){
 const fen=document.getElementById(id+"_fen")?.value||"Frente frío";
 const reg=document.getElementById(id+"_reg")?.value||"Sierra";
 const soil=document.getElementById(id+"_soil")?.value||"Seco";
 const river=document.getElementById(id+"_river")?.value||"Bajo";
 const coast=document.getElementById(id+"_coast")?.value||"Normal";
 const regulacion=document.getElementById(id+"_regulacion")?.value||"Disponibles";
 const fenScore={
  "Sierra":{"Ciclón tropical":3,"Interacción frente–ciclón":3,"Frente frío":2,"Onda tropical":1,"Lluvia convectiva":2,"Evento de Norte":0},
  "Usumacinta":{"Ciclón tropical":2,"Interacción frente–ciclón":3,"Frente frío":2,"Onda tropical":2,"Lluvia convectiva":1,"Evento de Norte":1},
  "Samaria–Carrizal":{"Ciclón tropical":2,"Interacción frente–ciclón":3,"Frente frío":2,"Onda tropical":1,"Lluvia convectiva":2,"Evento de Norte":1},
  "Chontalpa":{"Ciclón tropical":2,"Interacción frente–ciclón":2,"Frente frío":1,"Onda tropical":1,"Lluvia convectiva":2,"Evento de Norte":1},
  "Costa–Pantanos":{"Ciclón tropical":3,"Interacción frente–ciclón":3,"Frente frío":2,"Onda tropical":1,"Lluvia convectiva":1,"Evento de Norte":3},
  "Área urbana":{"Ciclón tropical":2,"Interacción frente–ciclón":3,"Frente frío":2,"Onda tropical":1,"Lluvia convectiva":3,"Evento de Norte":1}
 };
 let s=(fenScore[reg]||{})[fen]||1;
 if(soil==="Saturado")s+=2; else if(soil==="Húmedo")s+=1;
 if(river==="Alto")s+=2; else if(river==="Medio")s+=1;
 if(coast!=="Normal"){const cb={"Sierra":0,"Usumacinta":1,"Samaria–Carrizal":1,"Chontalpa":1,"Costa–Pantanos":2,"Área urbana":1};s+=(cb[reg]||0);}
 if(regulacion==="En llenado") s+=1; else if(regulacion==="Saturadas o reducidas") s+=2;
 const pct=Math.min(100,Math.round(s/10*100));
 const color=s>=8?"#f43f5e":s>=5?"#f97316":s>=3?"#f59e0b":"#10b981";
 const lbl=s>=8?"🔴 Extremo":s>=5?"🟠 Complejo":s>=3?"🟡 Vigilancia":"🟢 Ordinario";
 const bar=document.getElementById(id+"_preview_bar");
 const lab=document.getElementById(id+"_preview_label");
 if(bar){bar.style.width=pct+"%";bar.style.background=color;}
 if(lab){lab.textContent=lbl;lab.style.color=color;}
}

// Toast notifications
function showToast(msg, type='info', duration=2800){
  var c=document.getElementById('toast-container');
  if(!c){c=document.createElement('div');c.id='toast-container';document.body.appendChild(c);}
  var t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(function(){t.classList.add('fade');setTimeout(function(){c.removeChild(t)},300);},duration);
}
