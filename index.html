@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{
  --navy:#0a2540;--navy2:#1a3a5c;--cyan:#0ea5e9;--cyan2:#38bdf8;--cyan3:#e0f2fe;
  --emerald:#10b981;--em2:#ecfdf5;--amber:#f59e0b;--am2:#fffbeb;
  --rose:#f43f5e;--rose2:#fff1f2;--ink:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--surface:#f8fafc;--wh:#ffffff;
  --sh:0 2px 8px rgba(10,37,64,.08);--shm:0 6px 24px rgba(10,37,64,.12);--shl:0 16px 48px rgba(10,37,64,.16);
  --r:18px;--rs:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--surface);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;line-height:1.2;letter-spacing:-.02em}
h1{font-size:clamp(26px,4.5vw,52px);margin:0 0 12px;font-weight:900}
h2{font-size:clamp(21px,3vw,34px);color:var(--navy);margin:0 0 14px;font-weight:700}
h3{color:var(--navy2);margin:20px 0 8px;font-size:19px;font-weight:700}
h4{color:var(--emerald);margin:14px 0 6px;font-size:15px;font-weight:700}
p{margin:8px 0 12px}
ul{padding-left:22px}
button,.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .2s ease;letter-spacing:.01em}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--wh);color:var(--navy);box-shadow:var(--shm)}
.btn-primary:hover{box-shadow:var(--shl)}
.btn-secondary{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.btn-secondary:hover{background:rgba(255,255,255,.28)}
.btn-green{background:linear-gradient(135deg,var(--emerald),#059669);color:white;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn-green:hover{box-shadow:0 8px 22px rgba(16,185,129,.42)}
.btn-blue{background:linear-gradient(135deg,var(--cyan),#0284c7);color:white;box-shadow:0 4px 14px rgba(14,165,233,.3)}
.btn-blue:hover{box-shadow:0 8px 22px rgba(14,165,233,.42)}
.btn-dark{background:var(--navy);color:white;box-shadow:var(--sh)}
.btn-dark:hover{background:var(--navy2)}
.btn-light{background:var(--cyan3);color:var(--navy)}
.btn-light:hover{background:#bae6fd}
.btn-warn{background:var(--am2);color:#92400e;border:1px solid #fde68a}
.hidden{display:none!important}
header.hero{
  background:linear-gradient(135deg,#062040 0%,#0a3459 50%,#0e4d3b 100%);
  color:white;padding:38px 24px 34px;position:relative;overflow:hidden
}
header.hero::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none
}
header.hero::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.12) 0%,transparent 70%);top:-150px;right:-120px;pointer-events:none}
.hero-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr;gap:28px;align-items:center;position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;margin-bottom:14px;letter-spacing:.03em}
.badge::before{content:'●';color:#34d399;font-size:8px}
.hero p{font-size:17px;max-width:760px;opacity:.9;line-height:1.7}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--r);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.hero-card svg{width:100%;height:auto;display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:5}
.loginbox{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:28px;margin:28px auto;max-width:900px;box-shadow:var(--shl)}
label{font-weight:600;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--rs);margin:6px 0 14px;font:inherit;font-size:15px;background:var(--wh);transition:border-color .2s,box-shadow .2s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(14,165,233,.12)}
.password-wrap{position:relative;margin:6px 0 14px}
.password-wrap input{margin:0;padding-right:118px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:1px solid var(--border);background:#f8fafc;color:var(--navy);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1;white-space:nowrap;min-height:34px}
.password-toggle:hover{background:#eef6fb;border-color:#a8c9dc}
.password-toggle:focus-visible{outline:3px solid rgba(14,165,233,.25);outline-offset:2px}
@media(max-width:560px){.password-wrap input{padding-right:104px}.password-toggle{font-size:12px;padding:7px 8px}}
.layout{display:grid;grid-template-columns:300px 1fr;max-width:1600px;margin:auto;min-height:100vh;overflow-x:hidden}
aside{background:var(--wh);border-right:1px solid var(--border);min-height:100vh;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.logoBox{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:14px}
.logoMark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--emerald));display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:13px;flex-shrink:0;box-shadow:0 4px 12px rgba(10,37,64,.25)}
.nav button{width:100%;text-align:left;margin:2px 0;background:transparent;color:var(--muted);display:block;padding:9px 12px;border-radius:var(--rs);font-size:13px;font-weight:600;transition:all .15s ease;border:0;border-left:3px solid transparent}
.nav button:hover{background:var(--surface);color:var(--navy);transform:none}
.nav button.active{background:linear-gradient(135deg,rgba(10,37,64,.06),rgba(14,165,233,.07));color:var(--navy);border-left-color:var(--cyan);font-weight:800}
main{padding:24px;min-width:0;overflow-x:hidden;word-break:break-word}
section.module,.panel{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:28px;margin:0 0 20px;box-shadow:var(--sh);animation:fsi .3s ease}
@keyframes fsi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--wh);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.note{background:var(--em2);border-left:4px solid var(--emerald);padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;margin:14px 0}
.warn{background:var(--am2);border-left:4px solid var(--amber);padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;margin:14px 0}
.key{background:linear-gradient(135deg,#eff6ff,#ecfdf5);border-left:4px solid var(--cyan);padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;margin:14px 0;font-weight:600}
.danger{background:var(--rose2);border-left:4px solid var(--rose);padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;margin:14px 0}
.pill{display:inline-block;background:var(--cyan3);border:1px solid #bae6fd;border-radius:999px;padding:4px 10px;margin:3px;font-size:12px;font-weight:600;color:var(--navy)}
table{width:100%;border-collapse:collapse;margin:14px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
th,td{border:1px solid var(--border);padding:12px 14px;text-align:left;vertical-align:top;min-width:90px}
th{background:linear-gradient(180deg,var(--surface),#e8f0f8);color:var(--navy);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
tr:nth-child(even) td{background:#f8fbff}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);margin:14px 0;box-shadow:var(--sh);max-width:100%}
.table-wrap table{margin:0;border-radius:0;box-shadow:none}
.progress{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--emerald));width:0%;transition:width .7s cubic-bezier(.4,0,.2,1);border-radius:999px}
.footerNav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.accordion{border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin:10px 0}
.acc-head{background:var(--surface);padding:13px 16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:12px;color:var(--navy);transition:background .15s;font-size:14px}
.acc-head:hover{background:#edf2f7}
.acc-body{display:none;padding:16px;background:white;border-top:1px solid var(--border);animation:accO .2s ease}
.acc-body.open{display:block}
@keyframes accO{from{opacity:0}to{opacity:1}}
.flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flip-card{perspective:1000px;height:180px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--sh)}
.flip-front{background:linear-gradient(135deg,var(--cyan3),var(--em2));font-size:15px;font-weight:800;color:var(--navy);font-family:'Fraunces',serif}
.flip-back{background:white;transform:rotateY(180deg);font-size:13px;align-items:flex-start;text-align:left;overflow:auto;line-height:1.55}
.interactive-box{background:linear-gradient(135deg,#f0f9ff,#f0fdf4);border:1px solid #bae6fd;border-radius:var(--r);padding:20px;margin:18px 0}
.interactive-box h3{margin-top:0;color:var(--navy)}
.result{margin-top:14px;background:var(--wh);border:1px solid var(--border);border-radius:var(--rs);padding:14px 16px;line-height:1.6;box-shadow:var(--sh)}
.region-map{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.map-canvas{background:linear-gradient(145deg,#e6f7ff,#eef7e7);border:1px solid var(--border);border-radius:var(--r);padding:18px;min-height:360px;position:relative;overflow:hidden}
.map-zone{position:absolute;border:2px solid rgba(10,37,64,.25);background:rgba(255,255,255,.84);border-radius:16px;padding:10px;font-weight:700;color:var(--navy);cursor:pointer;box-shadow:var(--sh);transition:all .2s ease;font-size:13px;backdrop-filter:blur(4px)}
.map-zone:hover,.map-zone.active{transform:scale(1.04);background:var(--navy);color:white;box-shadow:var(--shm)}
.zone-us{right:28px;top:70px;width:210px}
.zone-sierra{left:75px;top:48px;width:205px}
.zone-grijalva{left:95px;top:180px;width:240px}
.zone-chontalpa{left:38px;bottom:55px;width:215px}
.zone-costa{right:40px;bottom:42px;width:235px}
.water-line{position:absolute;height:6px;background:var(--cyan);border-radius:999px;opacity:.4;transform-origin:left center}
.route-box{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.route-steps button{display:block;width:100%;margin:5px 0;text-align:left;background:var(--surface);color:var(--navy);border-radius:var(--rs);font-size:13px;padding:10px 14px}
.route-steps button.active{background:var(--emerald);color:white}
.timeline{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.timepoint{background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--navy);font-size:13px;transition:all .2s}
.timepoint.active{background:var(--navy);color:white;border-color:var(--navy)}
.timepoint:hover:not(.active){border-color:var(--cyan);color:var(--cyan)}
.hydro-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;align-items:start}
.hydro-svg{background:white;border:1px solid var(--border);border-radius:var(--r);padding:12px;width:100%;height:auto}
.hydro-point{cursor:pointer}
.hydro-point circle{fill:white;stroke:var(--cyan);stroke-width:4;transition:fill .2s}
.hydro-point:hover circle,.hydro-point.active circle{fill:var(--amber);stroke:var(--amber)}
.option{display:block;border:2px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin:8px 0;background:white;cursor:pointer;transition:all .15s;font-size:14px}
.option:hover{border-color:var(--cyan);background:var(--cyan3)}
.option.correct{border-color:var(--emerald);background:var(--em2)}
.option.wrong{border-color:var(--rose);background:var(--rose2)}
.case-card{border:1px solid var(--border);border-radius:var(--r);padding:18px;background:white;margin:14px 0;box-shadow:var(--sh)}
.dropzone{border:2px dashed var(--border);border-radius:var(--rs);padding:14px;min-height:54px;background:#fafafa}
.choice-chip{display:inline-flex;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:8px 14px;margin:4px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.choice-chip.selected{background:var(--navy);color:white;border-color:var(--navy)}
.choice-chip:hover:not(.selected){border-color:var(--cyan)}
.glossary-results{max-height:440px;overflow:auto;padding-right:4px}
.glossary-results .card{border-radius:var(--rs);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:linear-gradient(135deg,var(--surface),white);border:1px solid var(--border);border-radius:var(--r);padding:18px;text-align:center;transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.kpi b{font-size:32px;color:var(--navy);display:block;font-family:'Fraunces',serif}
.adminTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.adminTabs button{background:var(--surface);color:var(--navy);border-radius:var(--rs)!important}
.adminTabs button.active{background:var(--navy);color:white}
.menuToggle{display:none;position:fixed;right:16px;bottom:20px;z-index:30;border-radius:999px!important;background:var(--navy);color:white;box-shadow:var(--shl);padding:12px 18px;font-size:14px;font-weight:700}
main{padding:24px;min-width:0;padding-bottom:90px;overflow-x:hidden;word-break:break-word}
.cert{border:10px solid var(--navy);padding:34px;text-align:center;background:white;max-width:900px;margin:auto;border-radius:var(--r)}
.cert h2{font-size:34px;color:var(--navy)}
.semaforo-box{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.sem-card{border-radius:var(--r);padding:16px;text-align:center;font-weight:800;font-size:14px;border:2px solid transparent;transition:all .25s ease;cursor:default}
.sem-verde{background:var(--em2);color:#065f46}
.sem-amarillo{background:#fefce8;color:#713f12}
.sem-naranja{background:#fff7ed;color:#7c2d12}
.sem-rojo{background:var(--rose2);color:#881337}
.sem-card.active{transform:scale(1.06)}
.sem-verde.active{box-shadow:0 0 0 3px var(--emerald),0 8px 24px rgba(16,185,129,.25)}
.sem-amarillo.active{box-shadow:0 0 0 3px var(--amber),0 8px 24px rgba(245,158,11,.25)}
.sem-naranja.active{box-shadow:0 0 0 3px #f97316,0 8px 24px rgba(249,115,22,.25)}
.sem-rojo.active{box-shadow:0 0 0 3px var(--rose),0 8px 24px rgba(244,63,94,.25)}
.check-grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(245px,1fr))!important;gap:10px!important;margin:12px 0 16px!important}
.check-item{display:flex!important;align-items:center!important;gap:12px!important;min-height:56px;padding:12px 14px!important;background:white!important;border:2px solid var(--border)!important;border-radius:12px!important;color:var(--navy)!important;font-weight:600!important;cursor:pointer;transition:all .15s ease;text-align:left!important}
.check-item:hover{border-color:var(--cyan)!important;background:var(--cyan3)!important}
.check-item input[type="checkbox"]{width:20px!important;height:20px!important;min-width:20px!important;margin:0!important;accent-color:var(--cyan);cursor:pointer}
.check-item:has(input:checked){background:var(--cyan3)!important;border-color:var(--cyan)!important}
.tool-action-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0 12px}
.tool-help{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.tool-result-title{color:var(--navy);font-weight:800;font-size:18px;font-family:'Fraunces',serif;margin-bottom:6px}
.tool-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--navy);color:white;border-radius:999px;font-size:12px;font-weight:800;flex-shrink:0}
.myth-card{border:1px solid var(--border);border-radius:var(--rs);background:white;padding:14px 16px;margin:10px 0;cursor:pointer;transition:all .2s}
.myth-card:hover{border-color:var(--cyan);background:var(--cyan3)}
.myth-card.open{border-color:var(--emerald);background:var(--em2)}
.myth-card .realidad{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--emerald)}
.myth-card.open .realidad{display:block}
.relation-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;margin:8px 0;background:white;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px}
.mini-eval{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin:18px 0}
.final-question{background:white;border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0;box-shadow:var(--sh)}
.final-question h3{margin-top:0;font-size:17px}
.final-option{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin:8px 0;cursor:pointer;font-weight:600;font-size:14px;transition:all .15s;font-family:inherit}
.final-option:hover{border-color:var(--cyan);background:var(--cyan3)}
.final-option.selected{border-color:var(--cyan);background:var(--cyan3);box-shadow:0 0 0 2px rgba(14,165,233,.2)}
.final-option.correct{border-color:var(--emerald);background:var(--em2)}
.final-option.wrong{border-color:var(--rose);background:var(--rose2)}
.diploma-digital{max-width:1000px;margin:0 auto;background:white;border:8px solid var(--navy);border-radius:var(--r);padding:40px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shl)}
.diploma-digital::before{content:"";position:absolute;inset:20px;border:2px solid #d7b46a;border-radius:10px;pointer-events:none;opacity:.6}

.diploma-logo{max-width:380px;width:72%;height:auto;display:block;margin:0 auto 20px}

.diploma-text{max-width:780px;margin:12px auto;font-size:17px;color:var(--muted)}
.signature-box{margin:36px auto 0;max-width:520px;text-align:center}

.hero-logo{display:block;width:100%;max-width:640px;height:auto!important;max-height:none!important;object-fit:contain!important;object-position:center center!important;background:#ffffff;border-radius:14px;padding:0;margin:0 0 18px 0;box-shadow:var(--shm)}

.small{font-size:13px;color:var(--muted)}
/* TOAST */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--navy);color:white;padding:12px 20px;border-radius:var(--rs);font-weight:600;font-size:14px;box-shadow:var(--shl);animation:toastIn .3s ease;opacity:1;transition:opacity .3s}
.toast.fade{opacity:0}
.toast.success{background:linear-gradient(135deg,var(--emerald),#059669)}
.toast.info{background:linear-gradient(135deg,var(--cyan),#0284c7)}
@keyframes toastIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

const concepts=[
 ["Cuenca","Territorio donde el agua de lluvia escurre hacia un mismo punto de salida: río, laguna, humedal o desembocadura. Para Tabasco destacan dos Regiones Hidrológicas oficiales: RH-30 Grijalva–Usumacinta y RH-29 Coatzacoalcos; para la operación local se analizan sistemas hidrológicos regionales."],
 ["Subcuenca","Unidad menor dentro de una cuenca principal. Permite analizar respuestas diferenciadas: Sierra, Samaria–Carrizal, Usumacinta, Chontalpa o Costa–Pantanos."],
 ["Gasto","Volumen de agua que pasa por una sección del río cada segundo, expresado en m³/s. Ayuda a dimensionar la magnitud real de una creciente."],
 ["Nivel hidrométrico","Altura del agua respecto a una escala local. Debe interpretarse junto con gasto, tendencia, NAMO/NAME y ubicación de la estación."],

 ["Laminación","Atenuación de una avenida por almacenamiento temporal en presas, humedales, planicies o cauces amplios."],

];

const glossary=[
 {term:"Acumulado de lluvia",def:"Cantidad total de lluvia registrada en un periodo.",ex:"80 mm en 6 horas puede tener más impacto que 80 mm en 24 horas si cae sobre una cuenca serrana.",rel:"intensidad, duración, escurrimiento"},
 {term:"Avenida",def:"Incremento notable del gasto o nivel de un río durante un evento.",ex:"Una avenida del Usumacinta puede propagarse progresivamente hacia Los Ríos y Centla.",rel:"hidrograma, pico, gasto"},
 {term:"Azolvamiento",def:"Acumulación de sedimentos en cauces, drenes, lagunas o bocanas.",ex:"En la costa puede reducir la capacidad de salida del agua hacia el Golfo.",rel:"bocana, sedimentos, drenaje"},
 {term:"Bocana",def:"Comunicación natural o artificial entre laguna/cauce y mar.",ex:"Una bocana estrecha o azolvada puede prolongar anegamientos en Costa–Pantanos.",rel:"marea, costa, azolvamiento"},
 {term:"Caudal o gasto",def:"Volumen de agua que pasa por una sección por segundo.",ex:"Se expresa en m³/s y permite comparar magnitud entre ríos.",rel:"nivel, hidrograma"},

 {term:"Hidrograma",def:"Gráfica de nivel o gasto en función del tiempo.",ex:"Permite identificar el pico de una creciente o una meseta prolongada.",rel:"nivel, gasto, avenida"},
 {term:"Zona de regulación natural",def:"Planicie, bajo, laguna, humedal o brazo secundario que almacena temporalmente agua durante una creciente y reduce el pico aguas abajo.",ex:"Al comparar Landsat de una creciente máxima con el evento actual puede estimarse cuántas hectáreas siguen disponibles para amortiguar el agua.",rel:"humedal, laminación, planicie"},
{term:"Humedal",def:"Ecosistema saturado de agua que puede almacenar y regular flujos.",ex:"Pantanos de Centla funcionan como zona de regulación natural.",rel:"laminación, planicie"},
 {term:"Laminación",def:"Reducción o atenuación de una avenida por almacenamiento temporal.",ex:"Puede ocurrir en presas, humedales o planicies.",rel:"avenida, regulación"},
 {term:"Marea",def:"Oscilación del nivel del mar.",ex:"La marea alta puede dificultar la salida del agua en Costa–Pantanos.",rel:"costa, remanso"},
 {term:"NAMO",def:"Nivel de Aguas Máximas Ordinarias, referencia de operación hidráulica.",ex:"Se usa en presas y cuerpos de agua como referencia técnica.",rel:"nivel, operación"},

function simulateFloodType(){
 const vals=[...document.querySelectorAll("#floodChecks input:checked")].map(x=>x.value);
 let score={pluvial:0,fluvial:0,remanso:0,costera:0,mixta:0};
 if(vals.includes("Lluvia local intensa")){score.pluvial+=2;score.mixta++}
 if(vals.includes("Drenaje insuficiente")){score.pluvial++;score.mixta++}
 if(vals.includes("Río alto o desbordado")){score.fluvial+=2;score.remanso++;score.mixta++}
 if(vals.includes("Lluvia en cuenca alta")){score.fluvial++;score.mixta++}
 if(vals.includes("Marea alta")){score.costera+=2;score.remanso++;score.mixta++}
 if(vals.includes("Norte fuerte")){score.costera++;score.remanso++;score.mixta++}
 if(vals.includes("Bocana azolvada")){score.remanso+=2;score.costera++;score.mixta++}
 if(vals.includes("Suelo saturado")){score.pluvial++;score.fluvial++;score.mixta++}
 let maxType=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
 if(vals.length>=4) maxType="mixta";
 const names={pluvial:"Inundación pluvial",fluvial:"Inundación fluvial",remanso:"Inundación por remanso",costera:"Inundación costera-lagunar",mixta:"Inundación mixta"};
 const explain={
  pluvial:"Predomina la lluvia local y la capacidad limitada de drenaje. Es típica de zonas urbanas, cabeceras municipales o planicies con drenes insuficientes.",
  fluvial:"Predomina el incremento del río por lluvia en la cuenca o desbordamiento. Debe observarse nivel, gasto, tendencia y estaciones aguas arriba.",
  remanso:"Predomina la dificultad de salida del agua por niveles altos aguas abajo, bocanas, marea, confluencias o restricciones hidráulicas.",
  costera:"Predominan procesos de costa: marea, Norte, oleaje, lagunas y bocanas. El agua puede permanecer aunque la lluvia disminuya.",

 };

function didacticSemaphoreHTML(){
 return `<div class="interactive-box">
  <h3>2. Semáforo didáctico hidrológico</h3>
  <p>Selecciona condiciones. El color es didáctico, no oficial.</p>

   <div><label>Costa/drenaje</label><select id="semCoast"><option>Normal</option><option>Drenaje lento</option><option>Marea alta</option><option>Norte fuerte</option></select></div>
  </div>
  <button class="btn-blue" onclick="calcSemaphore()">Calcular semáforo didáctico</button>

   <div id="semV" class="sem-card sem-verde">Verde<br><small>ordinario</small></div>

   <div id="semN" class="sem-card sem-naranja">Naranja<br><small>complejo</small></div>

  </div>

}
// Escala SMN 24 h: 1=Lluvias aisladas 2=Intervalos de chubascos 3=Lluvias fuertes 4=Lluvias muy fuertes 5=Lluvias intensas 6=Lluvias torrenciales 7=Lluvias extraordinarias
var SMN_LABELS=["","Lluvias aisladas","Intervalos de chubascos","Lluvias fuertes","Lluvias muy fuertes","Lluvias intensas","Lluvias torrenciales","Lluvias extraordinarias"];
var SMN_RANGE=["","0.1–5 mm/24h","5.1–25 mm/24h","25.1–50 mm/24h","50.1–75 mm/24h","75.1–150 mm/24h","150.1–250 mm/24h",">250 mm/24h"];
function calcSemaphore(){
 var s=0;
 var rainV=Number(semRain.value), soil=semSoil.value, river=semRiver.value, coast=semCoast.value;
 // Puntuación SMN: Aisladas=0, Chubascos=1, Fuertes=2, Muy fuertes=3, Intensas=4, Torrenciales=5, Extraordinarias=6
 s+=Math.max(0,rainV-1);
 if(soil==="Húmedo")s+=1; if(soil==="Saturado")s+=2;
 if(river==="Medio")s+=1; if(river==="Alto")s+=2;
 if(coast!=="Normal")s+=1;
 var rainLabel=SMN_LABELS[rainV]||"Lluvias aisladas";
 var rainRange=SMN_RANGE[rainV]||"";
 var level=s>=11?["semR","Rojo — Escenario extremo","Lluvia de categoría "+rainLabel+" ("+rainRange+") combinada con condiciones desfavorables. Respuesta rápida probable, desbordamiento, remanso o permanencia prolongada. Activar protocolos de emergencia."]:s>=7?["semN","Naranja — Escenario complejo","Lluvia "+rainLabel+" ("+rainRange+"). Se recomienda interpretar lluvia, ríos, suelo y drenaje/costa de forma integrada. Vigilancia activa y comunicados preventivos."]:s>=4?["semA","Amarillo — Escenario de vigilancia","Lluvia "+rainLabel+" ("+rainRange+"). Factores que pueden evolucionar si persiste la lluvia o suben los ríos. Monitoreo continuo."]:["semV","Verde — Condiciones ordinarias","Lluvia "+rainLabel+" ("+rainRange+"). Baja complejidad hidrológica con las condiciones actuales. Seguimiento de rutina."];
 ["semV","semA","semN","semR"].forEach(function(id){document.getElementById(id).classList.remove("active");});
 document.getElementById(level[0]).classList.add("active");
 document.getElementById("semOut").innerHTML="<b>"+level[1]+"</b><br>"+level[2]+"<br><br><span style='font-size:13px;color:var(--muted)'><b>Condiciones evaluadas (escala SMN):</b> lluvia "+rainLabel+" · "+rainRange+" | suelo "+soil.toLowerCase()+" | río "+river.toLowerCase()+" | costa/drenaje "+coast.toLowerCase()+"</span>";
}

<p>Esta guía presenta los fundamentos de hidrología aplicada e inundaciones de Tabasco, diferenciando las regiones hidrológicas oficiales y los sistemas hidrológicos regionales que influyen en el estado. Integra explicación técnica con elementos interactivos para que el usuario pueda interpretar lluvias, comparar sistemas, seguir rutas del agua, leer hidrogramas, construir escenarios y resolver casos.</p>
<div class="note"><b>Cómo usar esta guía si no conoces hidrología:</b> piensa en la cuenca como un “embudo natural”. La lluvia cae en una superficie amplia, escurre por laderas, arroyos y ríos, se concentra en cauces mayores, llega a planicies, humedales, lagunas y finalmente al mar. En Tabasco, ese embudo no termina rápido: la pendiente es baja, los ríos se conectan con lagunas y pantanos, y la salida al Golfo puede frenarse por marea, viento del Norte o bocanas azolvadas.</div>
<div class="grid2">
 <div class="card"><h3>Preguntas que guían el aprendizaje</h3><ul><li>¿Dónde llovió: en mi localidad, en la Sierra, en Chiapas o en Guatemala?</li><li>¿La lluvia fue intensa en pocas horas o acumulada durante varios días?</li><li>¿El suelo estaba seco, húmedo o saturado?</li><li>¿El río tiene salida libre o hay remanso aguas abajo?</li><li>¿La región responde rápido, lento o de forma prolongada?</li></ul></div>
 <div class="card"><h3>Lectura sencilla del territorio</h3><p>La Sierra funciona como zona de generación rápida de escurrimientos; la planicie central como zona de conducción, distribución y almacenamiento; y la costa-delta como zona de salida lenta, mezcla con lagunas y contacto con el mar.</p></div>
</div>

<div class="grid">
 <div class="card"><h3>Propósito</h3><p>Fortalecer la cultura hídrica y la comprensión técnica de las inundaciones diferenciadas en Tabasco.</p></div>
 <div class="card"><h3>Enfoque</h3><p>Cuencas, subcuencas, lluvia, escurrimiento, gasto, nivel, remanso, planicie, costa y gestión integral.</p></div>
 <div class="card"><h3>Aprendizaje activo</h3><p>La guía incluye menús desplegables, tarjetas, selectores, mapas, rutas, hidrogramas, comparadores y evaluación por casos.</p></div>
</div>

<div class="key">Idea rectora: no se puede comprender una inundación sin comprender primero la cuenca que la produce.</div>`},

{short:"1. Fenómenos y lluvias",t:"Fenómenos meteorológicos e intensidad de lluvias",html:`
<h2>1. Fenómenos meteorológicos comunes e interpretación de lluvias</h2>
<div class="amh-gallery"><figure class="amh-visual"><img loading="lazy" src="images/img_04.webp" alt="Fenómenos meteorológicos comunes en Tabasco y clasificación de precipitación acumulada" decoding="async"></figure></div>
<p>La lluvia en Tabasco puede originarse por ondas tropicales, frentes fríos, eventos de Norte, ciclones tropicales, canales de baja presión, convección local y lluvia orográfica. Para interpretar el riesgo no basta preguntar “cuánto llovió”: también importa <b>dónde llovió, en cuánto tiempo, cómo estaba la cuenca y qué tan altos venían los ríos</b>.</p>
<figure class="amh-visual"><img loading="lazy" alt="Interacción frente frío y ciclón tropical" src="images/img_05.webp" decoding="async"></figure>

<div class="youth-band">
 <div class="youth-card"><b>🌧️ Acumulado</b>Cuánta lluvia cayó en total, normalmente en 24 horas.</div>
 <div class="youth-card"><b>⏱️ Intensidad</b>Qué tan rápido cayó. 80 mm en 1 hora puede impactar más que 80 mm repartidos en 24 horas.</div>
 <div class="youth-card"><b>🗺️ Ubicación</b>Puede llover poco en una comunidad y aun así subir el río por lluvia aguas arriba.</div>
 <div class="youth-card"><b>🧽 Suelo</b>Un suelo saturado convierte más lluvia en escurrimiento.</div>
 <div class="youth-card"><b>🟦 Regulación natural</b>Las planicies, bajos, lagunas y humedales se van llenando; cuando pierden espacio libre, la creciente se extiende y dura más.</div>
</div>
<div class="note"><b>Explicación para iniciar:</b> un fenómeno meteorológico es el proceso atmosférico que genera lluvia, viento, nubosidad o tormentas. Para la hidrología, lo importante es traducir ese fenómeno en una lectura de cuenca: volumen, duración, trayectoria, llenado de zonas de regulación y respuesta del río.</div>

<h3>Fenómenos frecuentes y lectura hidrológica</h3>
<table><tr><th>Fenómeno</th><th>Qué observar</th><th>Posible efecto hidrológico</th></tr>
<tr><td>Onda tropical</td><td>Bandas de lluvia, a veces intermitentes.</td><td>Saturación progresiva si se repite varios días.</td></tr>
<tr><td>Frente frío</td><td>Lluvia persistente, descenso de temperatura y viento del Norte.</td><td>Elevación de ríos, encharcamientos y salida lenta al mar.</td></tr>
<tr><td>Evento de Norte</td><td>Viento fuerte, oleaje y presión sobre la costa.</td><td>Puede dificultar el desalojo en bocanas, lagunas y zonas costeras.</td></tr>
<tr><td>Ciclón tropical</td><td>Bandas nubosas extensas, no solo el centro del ciclón.</td><td>Lluvia regional simultánea sobre varias cuencas.</td></tr>
<tr><td>Tormenta convectiva</td><td>Lluvia fuerte de corta duración, comúnmente vespertina.</td><td>Anegamientos urbanos, crecidas rápidas en arroyos y drenes.</td></tr>
<tr><td>Lluvia orográfica</td><td>Lluvia reforzada por montañas y laderas.</td><td>Crecientes rápidas en ríos serranos.</td></tr>
<tr><td>Interacción frente–ciclón</td><td>Humedad tropical más aire frío y lluvia persistente.</td><td>Escenario de alto impacto por lluvias extensas y prolongadas.</td></tr></table>

<h3>Rangos de lluvia usados por el SMN para acumulados en 24 horas</h3>
<span class="badge-smn">SMN · acumulado 24 h</span>
<table>
<tr><th>Rango aproximado</th><th>Clasificación</th><th>Lectura hidrológica para Tabasco</th></tr>
<tr><td>0.1 a 5 mm</td><td>Lluvias aisladas</td><td>Humedece superficies; impacto limitado si el suelo está seco.</td></tr>
<tr><td>5.1 a 25 mm</td><td>Intervalos de chubascos</td><td>Puede generar encharcamientos puntuales si el drenaje es limitado.</td></tr>
<tr><td>25.1 a 50 mm</td><td>Lluvias fuertes</td><td>Activa escurrimientos, drenes y cauces menores, especialmente con suelo húmedo.</td></tr>
<tr><td>50.1 a 75 mm</td><td>Lluvias muy fuertes</td><td>Puede incrementar ríos secundarios, drenes, zonas bajas y vialidades urbanas.</td></tr>
<tr><td>75.1 a 150 mm</td><td>Lluvias intensas</td><td>Puede detonar crecientes importantes en Sierra, Chontalpa, zona urbana o ríos de rápida respuesta.</td></tr>
<tr><td>150.1 a 250 mm</td><td>Lluvias torrenciales</td><td>Escenario de alto impacto: inundaciones urbanas/rurales, desbordamientos y saturación generalizada.</td></tr>
<tr><td>Mayor de 250 mm</td><td>Lluvias extraordinarias</td><td>Evento excepcional con potencial de emergencia mayor si coincide con cuencas saturadas o ríos altos.</td></tr>
</table>
${lluviaSelectorHTML("rain1")}
<div class="key">Mensaje clave: la lluvia debe leerse junto con duración, ubicación, saturación de suelo, niveles de ríos y condición de salida hacia planicie, lagunas o Golfo de México.</div>`},

{short:"2. Clima y ENOS",t:"Cambio climático, variabilidad climática, ENOS y eventos extremos",html:`
<h2>2. Cambio climático, variabilidad climática, ENOS y eventos extremos</h2>
<figure class="amh-visual"><img loading="lazy" src="images/img_06.webp" alt="Cambio climático y extremos hidrológicos" decoding="async"></figure>
<p>La hidrología regional se modifica por dos procesos que deben distinguirse: la <b>variabilidad climática</b>, que explica por qué unos años son más secos o lluviosos que otros, y el <b>cambio climático</b>, que modifica las condiciones de fondo del sistema climático durante décadas.</p>
<div class="youth-band">
 <div class="youth-card"><b>🌡️ Más calor</b>Mayor temperatura favorece evaporación y una atmósfera con más vapor de agua disponible.</div>
 <div class="youth-card"><b>🌧️ Lluvias más intensas</b>Puede aumentar la probabilidad de eventos concentrados en pocas horas.</div>
 <div class="youth-card"><b>🏜️ Sequía + lluvia</b>Periodos secos pueden alternarse con lluvias extremas, elevando el contraste hidrológico.</div>
 <div class="youth-card"><b>🌊 Costa vulnerable</b>El aumento del nivel del mar, erosión y bocanas azolvadas pueden dificultar el desalojo.</div>
</div>

<div class="grid2">
 <div class="card"><h3>¿Qué es cambio climático?</h3><p>Es la modificación sostenida del clima de la Tierra, asociada principalmente al incremento de gases de efecto invernadero. En Tabasco puede expresarse como mayor temperatura, lluvias más intensas, periodos secos más marcados, erosión costera y eventos extremos con impactos superiores a los históricos.</p></div>
 <div class="card"><h3>¿Qué es variabilidad climática?</h3><p>Son cambios naturales de una temporada a otra. Un año puede ser más seco o más húmedo por patrones oceánicos y atmosféricos, sin que eso contradiga la tendencia de largo plazo del cambio climático.</p></div>
</div>


<figure class="amh-visual"><img loading="lazy" alt="ENOS y fases climáticas" src="images/img_07.webp" decoding="async"></figure>
<h3>ENOS explicado sin tecnicismos: El Niño, La Niña y Neutral</h3>
<table><tr><th>Fase</th><th>Idea sencilla</th><th>Lectura para Tabasco</th></tr>
<tr><td>El Niño</td><td>Calentamiento anómalo del Pacífico ecuatorial.</td><td>Generalmente puede favorecer condiciones más cálidas y secas, menor lluvia relativa y menor actividad ciclónica en el Atlántico; aun así, no elimina lluvias extremas por frentes, ondas o sistemas locales.</td></tr>
<tr><td>La Niña</td><td>Enfriamiento anómalo del Pacífico ecuatorial.</td><td>Generalmente puede favorecer temporadas más húmedas, mayor actividad ciclónica del Atlántico y lluvias persistentes; en Tabasco aumenta la vigilancia por inundaciones, sobre todo si hay frentes y ríos altos.</td></tr>
<tr><td>Neutral</td><td>No domina claramente El Niño ni La Niña.</td><td>Los frentes fríos, ondas tropicales, humedad del Golfo, ciclones y condiciones locales pueden controlar el escenario.</td></tr></table>

<div class="warn"><b>Importante:</b> El Niño o La Niña no “producen” por sí solos una inundación. Modifican la probabilidad de ciertos escenarios. La emergencia se construye cuando coinciden lluvia intensa, suelo saturado, ríos altos, drenaje limitado, marea, viento del Norte o vulnerabilidad urbana/rural.</div>

${accordion([
["Cambio climático en lenguaje sencillo","Es como cambiar las condiciones base del juego: más calor, mayor energía disponible, contrastes más fuertes y posibilidad de lluvias intensas concentradas."],
["Efectos esperados en Tabasco","Más estrés por calor, periodos secos más marcados, lluvias extremas de corta duración, erosión costera, intrusión salina local y mayores retos para drenes, ríos y zonas bajas."],
["El Niño","En Tabasco suele asociarse con tendencia a condiciones más cálidas y secas, aunque pueden ocurrir lluvias puntuales fuertes por frentes, tormentas o sistemas tropicales."],
["La Niña","Suele aumentar la vigilancia por lluvias, actividad ciclónica del Atlántico y escenarios persistentes de humedad, especialmente si interactúa con frentes fríos."],
["Eventos extremos","Incluyen lluvias torrenciales, frentes persistentes, ciclones, interacción frente–ciclón, crecientes simultáneas y periodos prolongados de anegamiento."]
])}

<div class="interactive-box">
 <h3>Reto rápido</h3>
 <p>Si hay suelo saturado, ríos altos y pronóstico de lluvias persistentes, ¿qué lectura es más adecuada?</p>
 <button class="option" onclick="quickFeedback(this,true,'Correcto. La lectura debe integrar lluvia, cuenca, suelo, ríos, costa y vulnerabilidad.')">Integrar lluvia, cuenca y niveles.</button>
 <button class="option" onclick="quickFeedback(this,false,'No es suficiente. La lluvia local aislada no explica todos los impactos en Tabasco.')">Usar solo lluvia del municipio.</button>
 <button class="option" onclick="quickFeedback(this,false,'Incorrecto. En Tabasco los aportes aguas arriba pueden ser determinantes.')">Descartar aportes externos.</button>
 <div class="result hidden"></div>
</div>
<div class="key">Mensaje clave: cambio climático y ENOS obligan a trabajar con escenarios, incertidumbre y lectura integral de cuencas.</div>`},

{short:"3. Territorio del agua",t:"Tabasco como territorio del agua",html:`
<h2>3. Tabasco como territorio del agua</h2>
<figure class="amh-visual"><img loading="lazy" src="images/img_08.webp" alt="Mapa de regiones hidrológicas y red hidrográfica de Tabasco" decoding="async"></figure>
<p>Tabasco es una planicie de baja pendiente donde confluyen ríos de gran caudal, humedales, lagunas, drenes, zonas agrícolas, áreas urbanas y desembocaduras al Golfo de México. En términos oficiales, el estado se relaciona principalmente con dos <b>Regiones Hidrológicas</b>: <b>RH-30 Grijalva–Usumacinta</b> y <b>RH-29 Coatzacoalcos</b>. Para capacitación y operación se analizan además los <b>sistemas hidrológicos regionales</b>, porque ayudan a distinguir cómo responde cada zona ante la lluvia y las crecientes.</p>


<figure class="amh-visual amh-fullwidth">
  <img loading="lazy" alt="Distribución de la población por cuencas en Tabasco" src="images/img_09.webp" decoding="async">
</figure>

<div class="grid2">
 <div class="card">
<h3>1. RH-30 Grijalva–Usumacinta</h3><p>Es la Región Hidrológica dominante para Tabasco. Integra sistemas regulados y no regulados: Alto Grijalva, Mezcalapa, Samaria, Carrizal, Sierra, Puxcatán, Tulijá, Macuspana y Usumacinta. Recibe aportes de Chiapas, Guatemala y lluvias locales, y explica buena parte de las inundaciones regionales y prolongadas.</p></div>
 <div class="card"><h3>2. RH-29 Coatzacoalcos / sistema Tonalá–Zanapa</h3><p>Influye principalmente en el occidente del estado, especialmente Huimanguillo y Cárdenas. Incluye dinámica de ríos regionales, drenes, planicie agrícola y sistemas asociados al Tonalá–Zanapa, con respuesta importante ante lluvias intensas en la Sierra Norte de Chiapas, Veracruz y la Chontalpa Grande.</p></div>
</div>

<h3>Las tres piezas hidrológicas de Tabasco</h3>
<figure class="amh-visual"><img loading="lazy" alt="Tres zonas hidrológicas de Tabasco" src="images/img_10.webp" decoding="async"></figure>

<div class="grid">
 <div class="card"><h3>🏔️ Sierra y transición</h3><p>La pendiente acelera el escurrimiento. La lluvia se concentra rápido en arroyos y ríos; pueden aparecer crecientes súbitas, arrastre de sedimentos y ascensos en pocas horas.</p></div>
 <div class="card"><h3>🌾 Planicie baja</h3><p>Convergen ríos principales, drenes, canales y humedales. La pendiente es mínima; el agua se mueve lentamente, se almacena o se estanca cuando los ríos están altos.</p></div>
 <div class="card"><h3>🌊 Delta y costa</h3><p>Zona de desembocaduras, lagunas y pantanos. Se mezclan crecientes fluviales, marea, viento del Norte, oleaje y bocanas; el agua puede tardar más en salir.</p></div>
</div>

<h3>Por qué Tabasco no se interpreta como una sola cuenca</h3>
<p>No basta decir “llovió en Tabasco”. Hay que distinguir si la lluvia cayó en la cuenca alta, en la planicie, en zona urbana, en la costa o aguas arriba fuera del estado. Una comunidad puede tener poca lluvia local y recibir una creciente horas o días después por aportes de Chiapas, Guatemala o Veracruz.</p>
<div class="note"><b>Explicación sencilla:</b> Tabasco es una zona de llegada, reparto, almacenamiento y salida del agua. Lo que ocurre en montañas, presas, ríos libres, drenes agrícolas, lagunas y bocanas termina conectándose en la planicie.</div>

<div class="youth-band">
 <div class="youth-card"><b>📍 Pregunta 1</b>¿Dónde llovió realmente: localidad, cuenca alta, costa o región vecina?</div>
 <div class="youth-card"><b>📈 Pregunta 2</b>¿Los ríos ya venían altos o estaban cerca de su nivel crítico?</div>
 <div class="youth-card"><b>🚧 Pregunta 3</b>¿El drenaje, bocana o salida al mar está libre o limitada?</div>
 <div class="youth-card"><b>🕒 Pregunta 4</b>¿La respuesta será rápida, lenta o prolongada?</div>
</div>

<div class="key">Mensaje clave: no debe confundirse una Región Hidrológica oficial con un sistema hidrológico regional. Para Tabasco, las grandes referencias oficiales son RH-30 Grijalva–Usumacinta y RH-29 Coatzacoalcos; la operación local se entiende mejor mediante sistemas como Sierra, Usumacinta, Samaria–Carrizal, Chontalpa y Costa–Pantanos.</div>`},

{short:"4. Conceptos de cuenca",t:"Conceptos básicos para entender una cuenca",html:`
<h2>4. Conceptos básicos para entender una cuenca</h2>
<div class="amh-gallery"><figure class="amh-visual"><img loading="lazy" src="images/img_11.webp" alt="Ciclo hidrológico: el agua en movimiento continuo" decoding="async"></figure></div>
<p>Una cuenca es el territorio donde el agua de lluvia escurre hacia un punto común. Comprender sus partes permite interpretar por qué una lluvia en montaña puede reflejarse horas después en una planicie o por qué un río se mantiene alto sin lluvia local.</p>

<div class="amh-gallery"><figure class="amh-visual"><img loading="lazy" src="images/img_12.webp" alt="Anatomía de una cuenca hidrológica tropical" decoding="async"></figure></div>
<h3>Tipos de cuencas explicados para principiantes</h3>
<p>Una cuenca puede clasificarse de varias formas. Estas clasificaciones ayudan a entender por qué unas responden rápido y otras lentamente.</p>
<table><tr><th>Tipo de cuenca</th><th>Qué significa</th><th>Ejemplo o lectura para Tabasco</th></tr>
<tr><td>Cuenca alta</td><td>Zona de montaña o pendiente donde se genera escurrimiento.</td><td>Sierra de Tabasco y Chiapas: lluvia intensa produce respuesta rápida.</td></tr>
<tr><td>Cuenca media</td><td>Zona de transición donde se integran afluentes y aumenta el caudal.</td><td>Tramos donde ríos serranos y regionales van sumando aportes.</td></tr>
<tr><td>Cuenca baja</td><td>Planicie cercana a desembocaduras, con baja pendiente.</td><td>Tabasco funciona ampliamente como cuenca baja de sistemas regionales.</td></tr>
<tr><td>Cuenca exorreica</td><td>El agua llega finalmente al mar.</td><td>Grijalva, Usumacinta, González y Tonalá descargan hacia el Golfo.</td></tr>
<tr><td>Cuenca endorreica</td><td>El agua no llega al mar; se queda en lagos o depresiones cerradas.</td><td>No es la condición dominante estatal, pero sirve para distinguir sistemas cerrados.</td></tr>
<tr><td>Cuenca regulada</td><td>Su flujo está influido por presas u obras de control.</td><td>Alto Grijalva por La Angostura, Chicoasén, Malpaso y Peñitas.</td></tr>
<tr><td>Cuenca libre o no regulada</td><td>No tiene grandes embalses que controlen sus crecientes principales.</td><td>Usumacinta y varios ríos serranos mantienen comportamiento predominantemente natural.</td></tr>
<tr><td>Cuenca urbana</td><td>Superficie con calles, techos, pavimento y drenaje artificial.</td><td>Villahermosa y cabeceras municipales: la impermeabilización acelera escurrimiento.</td></tr>
<tr><td>Cuenca costera-lagunar</td><td>Combina escurrimientos, lagunas, bocanas, marea y mar.</td><td>Paraíso, Centla y sistemas asociados a Mecoacán, González y Tres Brazos.</td></tr></table>
<div class="note"><b>Diferencia clave:</b> una cuenca serrana se parece a una rampa: el agua baja rápido. Una cuenca de planicie se parece a una mesa casi plana: el agua se extiende y tarda en salir. Una cuenca costera-lagunar se parece a una puerta al mar que a veces se abre y a veces se frena por marea, viento o azolvamiento.</div>

${flipCards(concepts)}
<div class="note"><b>Secuencia didáctica:</b> lluvia en zona alta → escurrimiento en laderas → afluentes → río principal → planicie → humedal o laguna → desembocadura.</div>
<div class="key">Mensaje clave: una inundación se explica por el comportamiento de toda la cuenca, no solo por un tramo visible del río.</div>`},

{short:"5. Sistemas hidrológicos",t:"Grandes sistemas hidrológicos que influyen en Tabasco",html:`
<h2>5. Grandes sistemas hidrológicos que influyen en Tabasco</h2>
<p>Tabasco se entiende mejor distinguiendo entre las <b>Regiones Hidrológicas oficiales</b> —RH-30 Grijalva–Usumacinta y RH-29 Coatzacoalcos— y los <b>sistemas hidrológicos regionales</b> que funcionan dentro del territorio estatal, con origen, pendiente, tiempo de respuesta, propagación y tipo de inundación dominante.</p>
<h3>Cómo leer un sistema hidrológico</h3>
<p>Para entender cualquier sistema se recomienda responder seis preguntas: ¿dónde nace?, ¿qué ríos lo integran?, ¿qué tan rápido responde?, ¿cuánto volumen mueve?, ¿dónde se almacena o se desborda?, y ¿por dónde sale el agua?</p>
<table><tr><th>Sistema</th><th>Qué debe entender el usuario</th><th>Riesgo hidrológico dominante</th></tr>
<tr><td>Alto Grijalva</td><td>Es un sistema regulado por presas; su comportamiento depende de lluvia en Chiapas, almacenamiento y operación.</td><td>Crecientes reguladas, variación de gasto y efectos en planicie.</td></tr>
<tr><td>Usumacinta</td><td>Es una gran cuenca transfronteriza libre, con aportes de Guatemala y Chiapas.</td><td>Crecientes de gran volumen y permanencia prolongada.</td></tr>
<tr><td>Sierra</td><td>Son cuencas cortas de pendiente fuerte.</td><td>Crecientes súbitas y arrastre de sedimentos.</td></tr>
<tr><td>Samaria–Carrizal</td><td>Sistema asociado al Alto Grijalva regulado en Chiapas, Mezcalapa, bifurcación Samaria–Carrizal, estructura El Macayo, lluvia local y planicie de baja pendiente.</td><td>Inundación fluvial, pluvial y por remanso; depende de gasto proveniente del Alto Grijalva regulado en Chiapas, distribución del flujo, niveles aguas abajo y saturación de planicie.</td></tr>
<tr><td>Chontalpa Grande<br><small>Cuenca Coatzacoalcos–Tonalá</small></td><td>Región de Huimanguillo y Cárdenas vinculada hidrológicamente a la cuenca Coatzacoalcos–Tonalá, con influencia de ríos, drenes, canales agrícolas, planicie de baja pendiente e infraestructura carretera.</td><td>Anegamiento prolongado por drenaje insuficiente, lluvia acumulada, saturación de suelos, niveles altos en ríos receptores y limitada capacidad de desalojo en la planicie.</td></tr>
<tr><td>Costa-Pantanos</td><td>Es zona fluvio-lagunar y costera.</td><td>Remanso, marea, bocanas y lenta salida al Golfo.</td></tr></table>
<figure class="amh-visual"><img loading="lazy" alt="Sistemas hidrológicos regionales de Tabasco" src="images/img_13.webp" decoding="async"></figure>



${comparatorHTML()}
<div class="key">Mensaje clave: cada región de Tabasco tiene una lógica hidrológica propia, por eso las inundaciones no se comportan igual.</div>`},

{short:"6. Grijalva tabasqueño",t:"Sistema Grijalva tabasqueño, ríos serranos y aporte limitado del Alto Grijalva",html:`
<h2>6. Sistema Grijalva tabasqueño, ríos serranos y aporte limitado del Alto Grijalva</h2>
<p>En Tabasco, el Grijalva debe explicarse distinguiendo el <b>Grijalva tabasqueño</b> —conformado por los ríos Oxolotán, Amatán, Tacotalpa, La Sierra, Teapa, Puyacatengo y Pichucalco— y la <b>aportación regulada ya muy limitada</b> que llega del Sistema de Presas y del Platanar por el río Carrizal, aguas abajo de los malecones de Villahermosa, en La Pigua.</p>
<figure class="amh-visual"><img loading="lazy" alt="Sistema Alto Grijalva en Chiapas" src="images/img_14.webp" decoding="async"></figure>

<h3>Explicación paso a paso: Grijalva tabasqueño y aporte regulado del Alto Grijalva en Chiapas</h3>
<p>Para la lectura hidrológica local, el Sistema de Presas no debe presentarse como el componente dominante del Grijalva tabasqueño. Su señal llega <b>atenuada y condicionada</b>, mientras que la respuesta local depende de los ríos serranos y de planicie, la lluvia sobre Tacotalpa, Teapa, Jalapa y Centro, el remanso y la capacidad de salida hacia la planicie baja y Pantanos de Centla.</p>
<div class="grid2">
 <div class="card"><h3>Grijalva tabasqueño</h3><p>El <b>Grijalva tabasqueño</b> lo conforman los ríos <b>Oxolotán, Amatán, Tacotalpa, La Sierra, Teapa, Puyacatengo y Pichucalco</b>, que transitan por los municipios de <b>Tacotalpa, Teapa, Jalapa y Centro</b>.</p></div>
 <div class="card"><h3>Aporte regulado del Alto Grijalva en Chiapas</h3><p>Cuando se hable de <b>Grijalva regulado</b>, debe entenderse como el <b>Alto Grijalva en Chiapas</b>, asociado al sistema de presas. En el Grijalva tabasqueño, esa influencia llega ya muy limitada por el río Carrizal, junto con aportes del Platanar, aguas abajo de los malecones de Villahermosa, en el sitio conocido como <b>La Pigua</b>.</p></div>
 <div class="card"><h3>Qué significa regulación</h3><p>Regular no es detener toda el agua. Significa administrar entradas y salidas de un embalse para reducir picos, mantener seguridad hidráulica y transferir volúmenes bajo reglas de operación.</p></div>
 <div class="card"><h3>Por qué puede haber impacto aunque haya presas</h3><p>Si llueve mucho en la planicie, si los ríos serranos suben, si hay remanso o si se reduce la capacidad de salida, el sistema puede generar anegamientos aunque exista regulación aguas arriba.</p></div>
</div>
<h3>Conceptos que debe dominar el usuario</h3>
<ul><li><b>Ríos formadores:</b> Oxolotán, Amatán, Tacotalpa, La Sierra, Teapa, Puyacatengo y Pichucalco.</li><li><b>Aporte regulado del Alto Grijalva en Chiapas:</b> volumen ya atenuado del sistema de presas que llega a Tabasco por la red Mezcalapa–Carrizal; junto con el Platanar, se incorpora al Grijalva tabasqueño aguas abajo de los malecones de Villahermosa, en La Pigua.</li><li><b>Confluencia local:</b> sitio donde se suman aportes de ríos serranos, Carrizal, lluvia urbana y remanso.</li><li><b>Remanso:</b> cuando el agua no puede avanzar con libertad por niveles altos aguas abajo.</li><li><b>Planicie saturada:</b> cuando drenes, suelos y zonas bajas ya no tienen capacidad de recibir más agua.</li></ul>
<figure class="amh-visual"><img loading="lazy" alt="Influencia del sistema de presas en Tabasco" src="images/img_15.webp" decoding="async"></figure>


${routeHTML("grijalva")}
${accordion([
["Regulación hidráulica","Las presas almacenan, regulan y laminan volúmenes. La operación modifica el gasto que llega a la planicie tabasqueña."],

])}
<div class="key">Mensaje clave: el Grijalva tabasqueño lo conforman Oxolotán, Amatán, Tacotalpa, La Sierra, Teapa, Puyacatengo y Pichucalco. Recibe una aportación ya muy limitada del Sistema de Presas y Platanar por el río Carrizal, aguas abajo de los malecones de Villahermosa, en La Pigua.</div>`},

{short:"7. Usumacinta",t:"Sistema Usumacinta: cuenca transfronteriza",html:`
<h2>7. Sistema Usumacinta: cuenca transfronteriza y planicie de regulación</h2>
<p>El Usumacinta integra aportes de Guatemala, Chiapas y Tabasco. Su comportamiento en Los Ríos y Pantanos depende de volumen regional, propagación de crecientes y almacenamiento en planicies.</p>
<figure class="amh-visual amh-fullwidth">
  <img loading="lazy" alt="Cuenca del río Usumacinta y Subregión de los Ríos" src="images/img_16.webp" decoding="async">
</figure>

<h3>El Usumacinta explicado como gran sistema de volumen</h3>
<p>El Usumacinta no se comporta como una cuenca pequeña donde la lluvia y el impacto ocurren casi al mismo tiempo. Es una cuenca enorme: una parte importante del agua se genera fuera de Tabasco, viaja por cauces mayores, se suma con otros ríos, entra por Boca del Cerro y luego se expande en planicies, brazos, humedales y zonas deltaicas.</p>
<div class="grid2">
 <div class="card"><h3>Por qué importa Guatemala y Chiapas</h3><p>Las lluvias en Guatemala y en la Selva de Chiapas pueden elevar el volumen que llega a Boca del Cerro. Por eso, la vigilancia no debe limitarse a la lluvia local en Tenosique o Balancán.</p></div>
 <div class="card"><h3>Por qué dura más aguas abajo</h3><p>Al avanzar hacia Jonuta y Centla, el río encuentra planicies amplias, humedales y confluencias. El agua se dispersa, se almacena y puede permanecer más tiempo.</p></div>
 <div class="card"><h3>Llenado de zonas de regulación</h3><p>Las zonas bajas, humedales, lagunas, brazos secundarios y planicies funcionan como amortiguamiento natural. Durante una creciente se van ocupando por etapas; cuando esa capacidad se reduce, el río pierde espacio para expandirse sin daño y aumenta el riesgo en caminos, viviendas, parcelas y localidades.</p></div>
 <div class="card"><h3>Lectura con imágenes satelitales</h3><p>Comparar imágenes Landsat de crecientes máximas históricas con imágenes de un evento en proceso permite estimar la superficie ya ocupada por agua y calcular cuántas hectáreas quedan disponibles como amortiguamiento o regulación natural.</p></div>
</div>
<div class="key"><b>Uso operativo:</b> si el evento actual ya ocupa una proporción alta de la planicie observada en crecientes máximas, debe asumirse menor capacidad de regulación remanente y mayor probabilidad de expansión hacia zonas habitadas o productivas.</div>
<h3>Lectura sencilla de la propagación</h3>
<table><tr><th>Tramo</th><th>Qué ocurre</th><th>Qué debe interpretarse</th></tr>
<tr><td>Cuenca alta</td><td>Se genera el volumen por lluvias regionales.</td><td>La lluvia puede estar lejos de Tabasco.</td></tr>
<tr><td>Boca del Cerro</td><td>Se observa la señal de entrada.</td><td>Sirve como referencia temprana.</td></tr>
<tr><td>Tenosique-Balancán-Zapata</td><td>La creciente se propaga.</td><td>El pico no llega igual a todos los puntos.</td></tr>
<tr><td>Jonuta-Centla</td><td>El agua se expande en planicie y humedales.</td><td>La duración puede ser prolongada.</td></tr></table>

${routeHTML("usumacinta")}
<div class="interactive-box">
 <h3>Línea de tiempo de una creciente</h3>
 <p>Selecciona un momento para revisar cómo puede propagarse una creciente regional.</p>
 <div class="timeline">
  <span class="timepoint" onclick="timeInfo(this,'0 h','Lluvia intensa en cuenca alta de Guatemala y Chiapas. Se genera volumen que iniciará su tránsito hacia Tabasco.')">0 h</span>
  <span class="timepoint" onclick="timeInfo(this,'24 h','Reflejo aproximado en Tenosique/Boca del Cerro, según distribución de lluvias, volumen y condiciones del cauce.')">24 h</span>
  <span class="timepoint" onclick="timeInfo(this,'48 h','Propagación hacia Balancán; la onda de creciente avanza y se modifica por planicies y aportes laterales.')">48 h</span>
  <span class="timepoint" onclick="timeInfo(this,'50 h','Posible reflejo hacia Emiliano Zapata con desfase respecto a Balancán.')">50 h</span>
  <span class="timepoint" onclick="timeInfo(this,'71 h','Efectos hacia Jonuta y zonas de planicie, con mayor permanencia del agua.')">71 h</span>
  <span class="timepoint" onclick="timeInfo(this,'Posterior','Influencia hacia Centla, humedales, confluencias y planicie deltaica.')">Posterior</span>
 </div>
 <div id="timeOut" class="result">Selecciona un punto de la línea de tiempo.</div>
</div>
<div class="key">Mensaje clave: el Usumacinta debe interpretarse como gran cuenca transfronteriza de volumen, propagación y permanencia.</div>`},

{short:"8. Ríos serranos",t:"Ríos serranos y respuesta rápida de cuencas cortas",html:`
<h2>8. Ríos serranos y respuesta rápida de cuencas cortas</h2>
<p>Los ríos serranos responden rápidamente ante lluvias intensas porque sus cuencas son cortas, con pendientes fuertes y concentración veloz del escurrimiento. La lluvia orográfica puede generar crecientes súbitas con arrastre de sedimentos.</p>
<h3>Qué es una cuenca de respuesta rápida</h3>
<p>Una cuenca de respuesta rápida es aquella donde la lluvia se convierte en escurrimiento en poco tiempo. Esto sucede cuando la pendiente es fuerte, el cauce es corto, el suelo está saturado o hay poca cobertura vegetal. En estos casos, el agua no se queda mucho tiempo en el terreno: baja rápido hacia arroyos y ríos.</p>
<figure class="amh-visual"><img loading="lazy" alt="Comportamiento de un río libre y sin presa en Tabasco" src="images/img_17.webp" decoding="async"></figure>

<div class="grid2">
 <div class="card"><h3>Para no especialistas</h3><p>Imagina tirar agua sobre una lámina inclinada: el agua corre rápido. Eso se parece a una cuenca serrana. Si además la lámina ya está mojada, el agua corre todavía más.</p></div>
 <div class="card"><h3>Qué observar</h3><p>Lluvia intensa en poco tiempo, turbiedad del agua, arrastre de ramas o sedimentos, ascenso rápido de arroyos, reportes de laderas inestables y saturación previa.</p></div>
</div>
<h3>Procesos asociados</h3>
<ul><li><b>Creciente súbita:</b> aumento rápido del nivel del río.</li><li><b>Arrastre de sedimentos:</b> material de laderas y cauces que reduce capacidad hidráulica.</li><li><b>Deslizamientos:</b> en laderas saturadas o degradadas.</li><li><b>Transferencia a planicie:</b> el problema baja hacia comunidades y zonas con menor pendiente.</li></ul>

<div class="grid2">
 <div class="card"><h3>Ríos principales</h3><p>Oxolotán, Amatán, Tacotalpa, La Sierra, Teapa, Puyacatengo y Pichucalco. Estos transitan por Tacotalpa, Teapa, Jalapa y Centro.</p></div>
 <div class="card"><h3>Sistema Puxcatán–Tulijá–Chilapa</h3><p>El Puxcatán y el Tulijá alimentan el sistema Chilapa. El Chilapa desemboca en el Grijalva por la margen derecha en la zona baja de Centla, antes de la unión Grijalva–Usumacinta.</p></div>
 <div class="card"><h3>Factores críticos</h3><p>Intensidad de lluvia, saturación del suelo, pendiente, cobertura vegetal, material de arrastre y tiempo de reflejo.</p></div>
</div>
${lluviaSelectorHTML("rain8")}
${scenarioHTML("sc8")}
<div class="key">Mensaje clave: en ríos serranos, la intensidad y el tiempo de respuesta pueden ser más determinantes que el acumulado total.</div>`},

{short:"9. Chontalpa",t:"Chontalpa Grande: ríos, drenajes y planicie agrícola",html:`
<h2>9. Chontalpa Grande: ríos, drenajes y planicie agrícola</h2>
<p>Chontalpa Grande, integrada por Huimanguillo y Cárdenas, presenta una hidrología marcada por planicies agrícolas, sistemas de drenaje, ríos regionales, infraestructura carretera y zonas bajas donde el agua puede acumularse por varios mecanismos simultáneos. Como referencia territorial, al ponderar la superficie municipal con los porcentajes hidrológicos de INEGI, aproximadamente <b>89% de la Chontalpa Grande</b> corresponde a la Región Hidrológica 29 Coatzacoalcos, asociada localmente al sistema Tonalá–Zanapa; el resto drena hacia Grijalva–Usumacinta.</p>
<h3>La Chontalpa como planicie de drenaje complejo</h3>
<p>En Chontalpa Grande no siempre domina un gran desbordamiento de río. Muchas veces el problema se construye por lluvia local, suelos de baja permeabilidad, drenes agrícolas saturados, canales con poco mantenimiento, pasos hidráulicos insuficientes y caminos que funcionan como barreras al flujo natural.</p>

<figure class="amh-visual" style="margin:18px 0 24px;">
  <img src="images/img_18.jpg" alt="Red hidrográfica principal de la cuenca del río Tonalá-Zanapa, Región Hidrológica RH-29 Coatzacoalcos" style="width:100%;max-width:none;display:block;margin:0 auto;border-radius:14px;" loading="lazy" decoding="async">
</figure>
<div class="grid2">
 <div class="card"><h3>Drenaje agrícola y planicie</h3><p>Los drenes ayudan a desalojar agua de zonas productivas, pero si el río receptor está alto o hay marea/remanso, el dren no descarga con facilidad. Entonces el agua permanece en parcelas, caminos y comunidades.</p></div>
 <div class="card"><h3>Zonas de regulación en Chontalpa Grande</h3><p>Los bajos, cuerpos lagunares, humedales, drenes y parcelas anegables funcionan como almacenamiento temporal. Cuando estas zonas ya están llenas, reducidas por bordos o interrumpidas por caminos, disminuye la capacidad de amortiguamiento y aumenta la permanencia del agua en zonas productivas y localidades.</p></div>
 <div class="card"><h3>Interacción regional</h3><p>Además de lluvia local, puede haber influencia de sistemas como Tonalá, Zanapa, Mezcalapa y Samaria, por lo que el diagnóstico debe considerar ríos, drenes y planicie juntos.</p></div>
</div>
<h3>Señales de inundación mixta</h3>
<ul><li>Lluvia intensa sobre suelos ya húmedos.</li><li>Drenes con niveles altos o flujo lento.</li><li>Río receptor alto.</li><li>Caminos o bordos que impiden el flujo transversal.</li><li>Agua que permanece varios días aun sin lluvia nueva.</li></ul>

<table>
<tr><th>Tipo de inundación</th><th>Cómo se genera</th><th>Lectura regional</th></tr>
<tr><td>Fluvial</td><td>Incremento y desbordamiento de cauces.</td><td>Río alto con planicie saturada.</td></tr>
<tr><td>Pluvial</td><td>Lluvia local supera capacidad de drenaje.</td><td>Acumulaciones urbanas o rurales inmediatas.</td></tr>
<tr><td>Por drenaje insuficiente</td><td>Drenes, canales o pasos hidráulicos no desalojan el volumen.</td><td>Agua permanece en parcelas, caminos o zonas bajas.</td></tr>
<tr><td>Mixta</td><td>Coinciden lluvia local, río alto, suelo saturado y bloqueo hidráulico.</td><td>Mayor duración e impacto territorial.</td></tr>
</table>
<div class="interactive-box">
 <h3>Clasificador de tipo de inundación</h3>
 <p>Selecciona el caso y revisa la interpretación.</p>
 <select id="chCase">
  <option value="fluvial">Río alto y desbordamiento en zona baja</option>
  <option value="pluvial">Lluvia intensa local con calles anegadas</option>
  <option value="drenaje">Dren agrícola saturado y agua retenida en parcelas</option>
  <option value="mixta">Río alto, lluvia local y drenaje insuficiente</option>
 </select>
 <button class="btn-blue" onclick="classifyChontalpa()">Interpretar</button>
 <div id="chOut" class="result">La interpretación aparecerá aquí.</div>
</div>
<div class="key">Mensaje clave: Chontalpa Grande se entiende como una planicie productiva donde ríos, drenes, suelos saturados, infraestructura y zonas de regulación natural interactúan.</div>`},

{short:"10. Costa-Pantanos",t:"Costa–Pantanos: interacción río, laguna, humedal y mar",html:`
<h2>10. Costa–Pantanos: interacción río, laguna, humedal y mar</h2>
<figure class="amh-visual"><img loading="lazy" src="images/img_19.webp" alt="Funcionamiento de una planicie inundable" decoding="async"></figure>
<p>En Centla, Paraíso y Comalcalco se combinan ríos, lagunas, humedales, barras, bocanas, mareas, viento del Norte y baja pendiente. El problema hidrológico no siempre es la entrada de agua, sino su lenta salida hacia el Golfo.</p>
<h3>Cómo funciona una zona fluvio-lagunar-costera</h3>
<p>En Costa–Pantanos, el agua no solo baja por ríos. También circula por lagunas, esteros, humedales, drenes y bocanas. La salida hacia el Golfo puede reducirse cuando hay marea alta, viento del Norte, oleaje, barras arenosas o azolvamiento. Por eso una lluvia que ya terminó puede seguir generando agua acumulada.</p>
<div class="grid2">
 <div class="card"><h3>Río González y Paraíso</h3><p>El sistema costero-lagunar asociado a Mecoacán, lagunas, arroyos y el río González funciona como eje de descarga hacia el Golfo. Si la salida se frena, el agua puede regresar o permanecer en zonas bajas.</p></div>
 <div class="card"><h3>Centla y Tres Brazos</h3><p>En Centla confluyen grandes volúmenes del Usumacinta y Grijalva. Los humedales almacenan agua, pero cuando están saturados, la permanencia aumenta y la salida depende de condiciones deltaicas y costeras.</p></div>
</div>
<h3>Factores costeros que un usuario debe distinguir</h3>
<table><tr><th>Factor</th><th>Explicación sencilla</th><th>Efecto</th></tr>
<tr><td>Marea alta</td><td>El nivel del mar sube.</td><td>Dificulta que ríos y lagunas descarguen.</td></tr>
<tr><td>Norte fuerte</td><td>Viento empuja agua hacia la costa.</td><td>Puede elevar niveles y favorecer remanso.</td></tr>
<tr><td>Bocana azolvada</td><td>La salida se estrecha por sedimentos.</td><td>Reduce capacidad de desalojo.</td></tr>
<tr><td>Laguna saturada</td><td>El cuerpo lagunar ya almacenó mucha agua.</td><td>Prolonga anegamientos.</td></tr></table>

<div class="grid">
 <div class="card"><h3>Centla</h3><p>Integra grandes volúmenes del Usumacinta y Grijalva, humedales extensos, Tres Brazos y conexiones deltaicas.</p></div>
 <div class="card"><h3>Paraíso</h3><p>Interacción entre sistemas lagunares, costa, bocanas, erosión, azolvamiento y ríos como el Seco.</p></div>
 <div class="card"><h3>Comalcalco</h3><p>Planicies bajas, drenajes, zonas productivas y conexión con sistemas lagunares y costeros.</p></div>
</div>
${scenarioHTML("sc10")}
<div class="interactive-box">
 <h3>¿Por qué no baja el agua?</h3>
 <p>Activa factores para construir una explicación.</p>
 <span class="choice-chip" onclick="toggleChip(this)">Río alto</span>
 <span class="choice-chip" onclick="toggleChip(this)">Marea alta</span>
 <span class="choice-chip" onclick="toggleChip(this)">Norte fuerte</span>
 <span class="choice-chip" onclick="toggleChip(this)">Bocana azolvada</span>
 <span class="choice-chip" onclick="toggleChip(this)">Laguna saturada</span>
 <span class="choice-chip" onclick="toggleChip(this)">Baja pendiente</span>
 <br><button class="btn-blue" onclick="whyWaterStays()">Explicar</button>
 <div id="whyOut" class="result">Selecciona factores.</div>
</div>
<div class="key">Mensaje clave: en Costa–Pantanos, la permanencia del agua depende de la interacción entre río, laguna, humedal, bocana, marea, viento y baja pendiente.</div>`},

{short:"11. Dinámica diferenciada",t:"Dinámica diferenciada de las inundaciones por sistema regional",html:`
<h2>11. Dinámica diferenciada de las inundaciones por sistema regional</h2>

<figure class="amh-visual"><img loading="lazy" src="images/img_20.webp" alt="Sistema Alto Grijalva, Chiapas" decoding="async"></figure>
<p>Una misma lluvia puede generar efectos muy distintos según el sistema hidrológico regional. La Sierra responde rápido; el Usumacinta propaga volumen; Samaria–Carrizal combina regulación y remanso; Chontalpa depende de drenaje; Costa–Pantanos depende de salida al mar.</p>
<h3>Cómo comparar sistemas sin confundirse</h3>
<figure class="amh-visual"><img loading="lazy" alt="Tipos de inundación en Tabasco" src="images/img_21.webp" decoding="async"></figure>

<p>La pregunta central no es “¿dónde llovió más?”, sino “¿qué sistema tiene condiciones para responder más rápido, almacenar más agua o desalojar más lento?”. Por eso, la guía compara origen del agua, pendiente, drenaje, volumen y salida.</p>
<div class="grid">
 <div class="card"><h3>Respuesta rápida</h3><p>Sierra: domina intensidad de lluvia, pendiente y saturación.</p></div>
 <div class="card"><h3>Respuesta prolongada</h3><p>Usumacinta y Costa–Pantanos: domina volumen, planicie, humedales y salida lenta.</p></div>
